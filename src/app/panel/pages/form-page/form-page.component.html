<div class="container-fluid">
  <div class="row">
    @for (form of params.forms; track form) {
      <div [class]="form.class ? form.class : 'col-sm-12'">
        <app-form
          [settings]="form"
          (response)="onResponse(form, $event)">
        </app-form>
      </div>
    }
  </div>
</div>
