<div [class]="field.class ? field.class : 'col-sm-12'" [ngClass]="{'hidden': field.hidden}">
  <p class="title">@if (field.icon) {
    <i [class]="field.icon"></i>
    }@if (field.title) {
    <span>{{field.title}}</span>
  } </p>
  @if (field.text) {
    <p class="text">{{ field.text }}</p>
  }
</div>
