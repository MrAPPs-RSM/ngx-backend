<div [formGroup]="form" [class]="field.class ? field.class : 'col-sm-12'" [ngClass]="{'hidden': field.hidden}">
  <div class="form-group" [ngClass]="{'has-error': !isValid()}">
    <label class="select-label">{{field.label}}
      @if (isRequired()) {
        <span>*</span>
      }
    </label>
    <ng-select [disabled]="field.disabled || onlyView"
      [items]="options"
      [typeahead]="field.search ? typeAhead : null"
      [addTag]="false"
      [multiple]="!!field.multiple"
      bindLabel="text"
      placeholder="{{field.placeholder}}"
      [(ngModel)]="selected"
      (change)="onChange($event)"
      [ngModelOptions]="{standalone: true}"
      [virtualScroll]="true"
      >
    </ng-select>
    @if (field.description) {
      <span class="help-block sub-little-text">{{field.description}}</span>
    }
  </div>
</div>
