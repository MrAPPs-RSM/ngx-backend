<div [class]="field.class ? field.class : 'col-sm-12'" [ngClass]="{'hidden': field.hidden}">
  <div class="form-group">
    @if (field.label) {
      <label>
        {{field.label}}
      </label>
    }
    <div>
      <img [src]="url" (error)="onImageError($event)">
    </div>
    @if (field.description) {
      <span class="help-block">{{field.description}}</span>
    }
  </div>
</div>
