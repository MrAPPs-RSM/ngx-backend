@if (isVisible) {
  <div [formGroup]="form" [class]="field.class ? field.class : 'col-sm-12'">
    <div class="form-group">
      <label>
        {{field.label}}
        @if (isRequired()) {
          <span>*</span>
        }
      </label>
      <mat-slider
        [min]="min"
        [max]="max"
        step="1"
        [value]="offset"
        (change)="updateOffset($event)">
      </mat-slider>
      <div class="preview-wrapper">
        <div class="preview">
          <img [src]="url"
            (error)="onImageError()">
          @if (max > 0) {
            <div class="value">
              <input type="number"
                [(ngModel)]="offset"
                (ngModelChange)="onChange()"
                [ngModelOptions]="{standalone: true}"
                [min]="min"
                [max]="max"
                >
              <span>/ {{max}}</span>
            </div>
          }
        </div>
      </div>
      <!-- Others -->
      @if (field.description) {
        <span class="help-block">{{field.description}}</span>
      }
    </div>
  </div>
}
