<div [formGroup]="form" [class]="field.class ? field.class : 'col-sm-12'" [ngClass]="{'hidden': field.hidden}">
  <div class="form-group" [ngClass]="{'has-error': !isValid()}">

    <label for="{{field.key}}">
      {{field.label}}
      @if (isRequired()) {
        <span>*</span>
      }
    </label>

    @if (field.options && field.options.editor) {
      <ckeditor
        [editor]="Editor"
        formControlName="{{field.key}}"
        (focus)="onFocus()"
        [config]="config"
        [readOnly]="readonly"
        >
      </ckeditor>
    }

    @if (!field.options || !field.options.editor) {
      <textarea
        id="{{field.key}}"
        formControlName="{{field.key}}"
        [attr.disabled]="field.disabled || onlyView ? '' : null"
        class="form-control"
        [attr.readonly]="field.readOnly ? true : null"
        placeholder="{{field.placeholder}}" [attr.maxlength]="getMaxLength()"
        >
        {{field.value}}
      </textarea>
    }

    @if (!field.options || !field.options.editor) {
      <small>
        {{getCountCharacters()}}
      </small>
    }

    @if (field.description) {
      <span class="help-block">{{field.description}}</span>
    }
  </div>

  <div id="editor"></div>
</div>
