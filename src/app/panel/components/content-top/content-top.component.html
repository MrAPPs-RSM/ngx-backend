<div>
  <div class="row">
    <div class="col-sm-8">
      <ul class="breadcrumb">
        @for (item of getBreadcrumbs(); track item) {
          <li>
            <a (click)="navigateTo(item)"
              [class.active]="isActive(item)"
            [innerHTML]="item.title"></a>
          </li>
        }
      </ul>
    </div>
  </div>
</div>
