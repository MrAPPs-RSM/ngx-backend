<div style="clear: both;" class="pagination-wrapper">
  @if (shouldShowPerPage()) {
    <nav class="ng2-smart-pagination-nav pull-left">
      <ul class="ng2-smart-pagination pagination">
        @for (number of perPageOptions; track number) {
          <li class="ng2-smart-page-item page-item"
            [ngClass]="{active: number == perPage}">
            <span class="ng2-smart-page-link page-link per-page-changer"
              (click)="perPageChange(number)">
              <span>{{number}}</span>
            </span>
          </li>
        }
      </ul>
    </nav>
  }

  @if (shouldShowPagination()) {
    <nav class="ng2-smart-pagination-nav pull-right">
      <ul class="ng2-smart-pagination pagination">
        <li class="ng2-smart-page-item page-item" [ngClass]="{disabled: getPage() == 1}">
          <a class="ng2-smart-page-link page-link" href="#"
            (click)="getPage() == 1 ? false : paginate(1)" aria-label="First">
            <span aria-hidden="true">&laquo;</span>
          </a>
        </li>
        @for (page of getPages(); track page) {
          <li class="ng2-smart-page-item page-item"
            [ngClass]="{active: getPage() == page}">
            @if (getPage() == page) {
              <span class="ng2-smart-page-link page-link"
                >{{ page }} <span class="sr-only"></span></span>
              }
              @if (getPage() != page) {
                <a class="ng2-smart-page-link page-link" href="#"
                (click)="paginate(page)">{{ page }}</a>
              }
            </li>
          }
          <li class="ng2-smart-page-item page-item"
            [ngClass]="{disabled: getPage() == getLast()}">
            <a class="ng2-smart-page-link page-link" href="#"
              (click)="getPage() == getLast() ? false : paginate(getLast())" aria-label="Last">
              <span aria-hidden="true">&raquo;</span>
            </a>
          </li>
        </ul>
      </nav>
    }
  </div>
